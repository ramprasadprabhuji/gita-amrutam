<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>శ్లోకం — గీతా అమృతం</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div id="chapter-banner" class="chapter-banner"></div>

<div class="container">
  <div class="verse-layout">
    <div class="verse-main" id="verse-root"></div>
    <aside class="sidebar">
      <div class="side-chapter-wrap" id="side-chapter"></div>

      <div class="royal-panel">
        <div class="royal-panel-header">📖 Chapter Progress</div>
        <div class="royal-panel-body" id="progress-body"></div>
      </div>

      <div class="royal-panel">
        <div class="royal-panel-header" id="verses-panel-title">🗂 All Verses</div>
        <div class="royal-panel-body">
          <div class="jump-grid" id="jump-grid"></div>
        </div>
      </div>

      <h5>అధ్యాయం మార్చండి</h5>
      <select class="chapter-select" id="chapter-select"></select>

      <div class="sidebar-actions">
        <button class="side-action-btn" onclick="sidebarComingSoon()">♡ Add to Favorites</button>
        <button class="side-action-btn" onclick="sidebarShare()">↗ Share This Verse</button>
        <button class="side-action-btn" onclick="sidebarPrint()">🖨 Print / PDF</button>
        <button class="side-action-btn" onclick="sidebarComingSoon()">🎧 Listen (Audio)</button>
      </div>

      <div class="side-quote-box" id="side-quote"></div>
    </aside>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  mountLayout("chapters");
  renderVerseDetail();
</script>
</body>
</html>
